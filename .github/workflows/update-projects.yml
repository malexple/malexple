name: Auto Update Projects

on:
  schedule:
    - cron: '0 6 * * *'  # Каждый день в 6:00 UTC
  workflow_dispatch:      # Ручной запуск

jobs:
  update-projects:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 🔧 Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 🚀 Build and run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: ./gradlew run --no-daemon

      - name: 💾 Commit changes
        run: |
          git config --global user.name 'malexple'
          git config --global user.email 'malexple@gmail.com'
          git add README.md ai-descriptions.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-update projects list" && git push)